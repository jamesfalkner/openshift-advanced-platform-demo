---
# =============================================================================
# E2E — Module 02: CI/CD pipeline (the core end-to-end flow)
# =============================================================================
#
# Demo outcome being validated (not the UI clicks):
#   A developer commit flows through the platform automatically:
#     git push  →  Tekton pipeline (build/scan/push)  →  Argo CD sync  →  the
#     new claims-statistics endpoint is live in the dev environment.
#
# This follows the Module 2 narrative EXACTLY (two pushes):
#   1. Mint a GitLab API token as the developer persona (dev1/common_password).
#   2. PHASE 1 — commit ClaimsStatsResource.java WITH code smells
#      (System.out.println, empty catch, field injection). Per the instructions
#      the pipeline MUST FAIL at the Sonarqube quality gate — we assert it fails.
#   3. PHASE 2 — commit the FIXED code (the demo uses the Roo Code AI; we commit
#      the known-good result) and assert the pipeline now SUCCEEDS.
#   4. Wait for the Argo CD parasol-insurance-dev app to be Synced + Healthy.
#   5. GET /api/claims/stats on the dev route and assert HTTP 200 + JSON.
#
# This is a MUTATING test (pushes to main). Run it against a test/validation
# instance, not a live customer-facing one.
#
# Usage:
#   ansible-playbook qa-automation/e2e-module-02.yml \
#     -e "ocp_api_url=https://api.cluster-xxx:6443" \
#     -e "ocp_admin_password=xxx" -e "common_password=openshift"
# =============================================================================

- name: "E2E Module 02: CI/CD pipeline"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _api_url: "{{ (ocp_api_url | default('')) or (openshift_api_url | default('')) or (openshift_api_server_url | default('')) }}"
    # The e2e MIMICS A REAL ATTENDEE: it authenticates as a demo persona (the
    # platform-engineer user `pe1` by default), NOT cluster-admin. pe1 has the
    # same console access a real user has (pipelines, Argo apps, routes, pods) plus
    # the platform-engineer actions used in the demo (e.g. the DevSpaces sample
    # ConfigMap). Override with -e qa_persona=dev1 if a module needs the developer.
    qa_persona: pe1
    qa_persona_password: "{{ common_password | default('openshift') }}"
    common_password: openshift
    # Developer persona who pushes the code (mimics the attendee in Module 1-2).
    gitlab_user: dev1
    gitlab_group: parasol
    gitlab_project: parasol-insurance
    gitlab_project_ref: "parasol%2Fparasol-insurance"
    stats_file_path: "src/main/java/com/parasol/ClaimsStatsResource.java"
    ns_build: parasol-insurance-build
    ns_dev: parasol-insurance-dev
    argocd_ns: rhdh-gitops
    argocd_app_dev: parasol-insurance-dev
    stats_endpoint_path: "/api/claims/stats"
    pipeline_retries: 90
    pipeline_delay: 10

  tasks:
    # --- Auth -------------------------------------------------------------
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - _api_url | length > 0
        fail_msg: "Pass ocp_api_url + ocp_admin_password (CLI) or run in the Showroom runner."

    - name: Log in to OpenShift as the demo persona ({{ qa_persona }})
      ansible.builtin.command:
        cmd: "oc login {{ _api_url }} --username {{ qa_persona }} --password {{ qa_persona_password }} --insecure-skip-tls-verify"
      changed_when: false
      no_log: true

    - name: Capture persona API token
      ansible.builtin.command: oc whoami -t
      register: _oc_token
      changed_when: false
      no_log: true

    - name: Set k8s auth to the persona identity
      ansible.builtin.set_fact:
        _k8s_host: "{{ _api_url }}"
        _k8s_api_key: "{{ _oc_token.stdout }}"
        _k8s_validate_certs: false
      no_log: true

    # --- GitLab API token (OAuth password grant) -------------------------
    - name: Get GitLab route
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: route.openshift.io/v1
        kind: Route
        namespace: gitlab
        name: gitlab
      register: r_gitlab_route

    - name: Fail if GitLab route missing
      ansible.builtin.fail:
        msg: "GitLab route gitlab/gitlab not found — cannot drive the pipeline."
      when: r_gitlab_route.resources | length == 0

    - name: Set GitLab URL
      ansible.builtin.set_fact:
        _gitlab_url: "https://{{ r_gitlab_route.resources[0].spec.host }}"

    - name: Mint GitLab API token via OAuth password grant
      ansible.builtin.uri:
        url: "{{ _gitlab_url }}/oauth/token"
        method: POST
        body_format: json
        body:
          grant_type: password
          username: "{{ gitlab_user }}"
          password: "{{ common_password }}"
        validate_certs: false
        status_code: [200]
      register: r_gitlab_oauth
      no_log: true

    - name: Set GitLab token
      ansible.builtin.set_fact:
        _gitlab_token: "{{ r_gitlab_oauth.json.access_token }}"
      no_log: true

    - name: Resolve project id
      ansible.builtin.uri:
        url: "{{ _gitlab_url }}/api/v4/projects/{{ gitlab_project_ref }}"
        method: GET
        headers:
          Authorization: "Bearer {{ _gitlab_token }}"
        validate_certs: false
        status_code: [200]
      register: r_project

    - name: Set project id
      ansible.builtin.set_fact:
        _project_id: "{{ r_project.json.id }}"

    - name: Check if stats file already exists on main
      ansible.builtin.uri:
        url: "{{ _gitlab_url }}/api/v4/projects/{{ _project_id }}/repository/files/{{ stats_file_path | urlencode }}?ref=main"
        method: GET
        headers:
          Authorization: "Bearer {{ _gitlab_token }}"
        validate_certs: false
        status_code: [200, 404]
      register: r_file_check

    # =====================================================================
    # PHASE 1 (Module 2 Part 1-2): the developer pushes code WITH code
    # smells (System.out.println, empty catch, field injection). Per the
    # instructions, the pipeline MUST FAIL at the Sonarqube quality gate.
    # =====================================================================
    - name: Record Phase-1 push timestamp
      ansible.builtin.command: date -u +%Y-%m-%dT%H:%M:%SZ
      register: r_now1
      changed_when: false

    - name: Commit ClaimsStatsResource.java WITH code smells (as {{ gitlab_user }})
      ansible.builtin.uri:
        url: "{{ _gitlab_url }}/api/v4/projects/{{ _project_id }}/repository/commits"
        method: POST
        headers:
          Authorization: "Bearer {{ _gitlab_token }}"
        body_format: json
        body:
          branch: main
          commit_message: "qa-e2e: add claims statistics endpoint"
          actions:
            - action: "{{ 'update' if (r_file_check.status == 200) else 'create' }}"
              file_path: "{{ stats_file_path }}"
              content: |
                package com.parasol;

                import java.util.HashMap;
                import java.util.Map;

                import jakarta.inject.Inject;
                import jakarta.ws.rs.GET;
                import jakarta.ws.rs.Path;
                import jakarta.ws.rs.Produces;
                import jakarta.ws.rs.core.MediaType;

                @Path("/api/claims/stats")
                @Produces(MediaType.APPLICATION_JSON)
                public class ClaimsStatsResource {

                    @Inject
                    ClaimsResource claimsResource;

                    @GET
                    public Map<String, Object> getStats() {
                        Map<String, Object> stats = new HashMap<>();

                        System.out.println("Fetching claim statistics");

                        try {
                            var claims = claimsResource.getAllClaims();
                            stats.put("total", claims.size());

                            Map<String, Long> byCategory = new HashMap<>();
                            for (var claim : claims) {
                                byCategory.merge(claim.getCategory(), 1L, Long::sum);
                            }
                            stats.put("by_category", byCategory);

                            Map<String, Long> byStatus = new HashMap<>();
                            for (var claim : claims) {
                                byStatus.merge(claim.getStatus(), 1L, Long::sum);
                            }
                            stats.put("by_status", byStatus);
                        } catch (Exception e) {
                        }

                        return stats;
                    }
                }
        validate_certs: false
        status_code: [201]

    - name: Wait for the Phase-1 PipelineRun to appear
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: tekton.dev/v1
        kind: PipelineRun
        namespace: "{{ ns_build }}"
      register: r_prs1
      until: >-
        r_prs1.resources | selectattr('metadata.creationTimestamp', 'ge', r_now1.stdout) | list | length > 0
      retries: 20
      delay: 10

    - name: Select the Phase-1 PipelineRun
      ansible.builtin.set_fact:
        _pr1_name: >-
          {{ (r_prs1.resources | selectattr('metadata.creationTimestamp', 'ge', r_now1.stdout)
              | sort(attribute='metadata.creationTimestamp') | last).metadata.name }}

    - name: Wait for the Phase-1 PipelineRun to COMPLETE (expecting failure)
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: tekton.dev/v1
        kind: PipelineRun
        namespace: "{{ ns_build }}"
        name: "{{ _pr1_name }}"
      register: r_pr1_status
      until:
        - r_pr1_status.resources[0].status.completionTime is defined
      retries: "{{ pipeline_retries }}"
      delay: "{{ pipeline_delay }}"

    - name: Assert Phase-1 pipeline FAILED (as the instructions require)
      ansible.builtin.assert:
        that:
          - >-
            r_pr1_status.resources[0].status.conditions
            | selectattr('type', 'equalto', 'Succeeded')
            | selectattr('status', 'equalto', 'False') | list | length > 0
        success_msg: "Phase 1 pipeline failed as expected (code smells caught)."
        fail_msg: >-
          Phase 1 pipeline did NOT fail. The instructions require the code-smell
          push to fail at the Sonarqube quality gate, but it completed successfully.

    - name: Confirm Phase-1 failed at the sonar-scan task (documented gate)
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: tekton.dev/v1
        kind: TaskRun
        namespace: "{{ ns_build }}"
        label_selectors:
          - "tekton.dev/pipelineRun={{ _pr1_name }}"
      register: r_pr1_tasks

    - name: Report which task failed in Phase 1
      ansible.builtin.debug:
        msg: >-
          Phase-1 failed task(s):
          {{ r_pr1_tasks.resources
             | selectattr('status.conditions', 'defined')
             | selectattr('status.conditions.0.status', 'equalto', 'False')
             | map(attribute='metadata.labels')
             | map(attribute='tekton.dev/pipelineTask') | list }}

    # =====================================================================
    # PHASE 2 (Module 2 Part 2-3): the developer fixes the code smells
    # (the demo uses the Roo Code AI; we commit the known-good result) and
    # pushes again. The pipeline MUST now PASS.
    # =====================================================================
    - name: Record Phase-2 push timestamp
      ansible.builtin.command: date -u +%Y-%m-%dT%H:%M:%SZ
      register: r_now2
      changed_when: false

    - name: Commit the FIXED ClaimsStatsResource.java (as {{ gitlab_user }})
      ansible.builtin.uri:
        url: "{{ _gitlab_url }}/api/v4/projects/{{ _project_id }}/repository/commits"
        method: POST
        headers:
          Authorization: "Bearer {{ _gitlab_token }}"
        body_format: json
        body:
          branch: main
          commit_message: "qa-e2e: fix code smells (proper logging, no empty catch, constructor injection)"
          actions:
            - action: update
              file_path: "{{ stats_file_path }}"
              content: |
                package com.parasol;

                import java.util.HashMap;
                import java.util.Map;

                import io.quarkus.logging.Log;
                import jakarta.ws.rs.GET;
                import jakarta.ws.rs.Path;
                import jakarta.ws.rs.Produces;
                import jakarta.ws.rs.core.MediaType;

                @Path("/api/claims/stats")
                @Produces(MediaType.APPLICATION_JSON)
                public class ClaimsStatsResource {

                    private final ClaimsResource claimsResource;

                    public ClaimsStatsResource(ClaimsResource claimsResource) {
                        this.claimsResource = claimsResource;
                    }

                    @GET
                    public Map<String, Object> getStats() {
                        Map<String, Object> stats = new HashMap<>();
                        Log.info("Fetching claim statistics");
                        var claims = claimsResource.getAllClaims();
                        stats.put("total", claims.size());
                        Map<String, Long> byCategory = new HashMap<>();
                        for (var claim : claims) {
                            byCategory.merge(claim.getCategory(), 1L, Long::sum);
                        }
                        stats.put("by_category", byCategory);
                        Map<String, Long> byStatus = new HashMap<>();
                        for (var claim : claims) {
                            byStatus.merge(claim.getStatus(), 1L, Long::sum);
                        }
                        stats.put("by_status", byStatus);
                        return stats;
                    }
                }
        validate_certs: false
        status_code: [201]

    - name: Wait for the Phase-2 PipelineRun to appear
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: tekton.dev/v1
        kind: PipelineRun
        namespace: "{{ ns_build }}"
      register: r_prs2
      until: >-
        r_prs2.resources | selectattr('metadata.creationTimestamp', 'ge', r_now2.stdout) | list | length > 0
      retries: 20
      delay: 10

    - name: Select the Phase-2 PipelineRun
      ansible.builtin.set_fact:
        _pr_name: >-
          {{ (r_prs2.resources | selectattr('metadata.creationTimestamp', 'ge', r_now2.stdout)
              | sort(attribute='metadata.creationTimestamp') | last).metadata.name }}

    - name: Wait for the Phase-2 PipelineRun to SUCCEED
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: tekton.dev/v1
        kind: PipelineRun
        namespace: "{{ ns_build }}"
        name: "{{ _pr_name }}"
      register: r_pr_status
      until:
        - r_pr_status.resources[0].status.conditions is defined
        - >-
          r_pr_status.resources[0].status.conditions
          | selectattr('type', 'equalto', 'Succeeded')
          | selectattr('status', 'equalto', 'True') | list | length > 0
      retries: "{{ pipeline_retries }}"
      delay: "{{ pipeline_delay }}"

    # --- Wait for Argo CD to deliver the change --------------------------
    - name: Wait for Argo CD dev app Synced + Healthy
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: "{{ argocd_ns }}"
        name: "{{ argocd_app_dev }}"
      register: r_argo
      until:
        - r_argo.resources | length > 0
        - (r_argo.resources[0].status.sync.status | default('')) == 'Synced'
        - (r_argo.resources[0].status.health.status | default('')) == 'Healthy'
      retries: 60
      delay: 10

    # --- Verify the endpoint is live ------------------------------------
    - name: Find Parasol dev route
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ ns_dev }}"
      register: r_dev_routes

    - name: Select a parasol route host
      ansible.builtin.set_fact:
        _parasol_host: >-
          {{ (r_dev_routes.resources | selectattr('spec.host', 'search', 'parasol')
              | list | first | default(r_dev_routes.resources | first)).spec.host }}

    - name: GET the claims stats endpoint (retry until app rolls out)
      ansible.builtin.uri:
        url: "https://{{ _parasol_host }}{{ stats_endpoint_path }}"
        method: GET
        validate_certs: false
        return_content: true
        status_code: [200]
      register: r_stats
      until:
        - r_stats.status == 200
        - "'total' in (r_stats.content | default(''))"
      retries: 30
      delay: 10

    # --- Summary --------------------------------------------------------
    - name: "Module 02 — PASSED"
      ansible.builtin.debug:
        msg: |
          CI/CD end-to-end verified (full Module 2 narrative):
          - Phase 1 (code smells) pipeline FAILED at the Sonar gate: {{ _pr1_name }}
          - Phase 2 (fixed) PipelineRun SUCCEEDED: {{ _pr_name }}
          - Argo CD {{ argocd_app_dev }} Synced + Healthy
          - {{ stats_endpoint_path }} live on https://{{ _parasol_host }}
