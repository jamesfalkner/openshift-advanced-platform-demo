---
# =============================================================================
# E2E — Module 06: Trusted software supply chain (TPA)
# =============================================================================
#
# Demo outcomes being validated (not the UI clicks):
#   - Trusted Profile Analyzer (TPA) is deployed and its UI/API answers.
#   - The TPA API serves SBOM / vulnerability data (the inventory the presenter
#     browses, searches by license, and drills into CVEs).
#
# Browsing SBOMs, filtering by license, and inspecting CVE dependency trees are
# visual; the backing fact is that TPA is up and its SBOM API returns data.
# =============================================================================

- name: "E2E Module 06: Trusted software supply chain"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _api_url: "{{ (ocp_api_url | default('')) or (openshift_api_url | default('')) or (openshift_api_server_url | default('')) }}"
    # The e2e MIMICS A REAL ATTENDEE: it authenticates as a demo persona (the
    # platform-engineer user `pe1` by default), NOT cluster-admin. pe1 has the
    # same console access a real user has (pipelines, Argo apps, routes, pods) plus
    # the platform-engineer actions used in the demo (e.g. the DevSpaces sample
    # ConfigMap). Override with -e qa_persona=dev1 if a module needs the developer.
    qa_persona: pe1
    qa_persona_password: "{{ common_password | default('openshift') }}"
    ns_tpa: trusted-profile-analyzer
    # The SBOM the user browses in TPA is the one the secured tag-promote
    # pipeline (Module 5) uploads. We assert at least one SBOM whose name
    # matches this is present.
    tpa_sbom_match: parasol
    e2e_failures: []

  tasks:
    # --- Auth -------------------------------------------------------------
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - _api_url | length > 0
        fail_msg: "Pass ocp_api_url + ocp_admin_password (CLI) or run in the Showroom runner."

    - name: Log in to OpenShift as the demo persona ({{ qa_persona }})
      ansible.builtin.command:
        cmd: "oc login {{ _api_url }} --username {{ qa_persona }} --password {{ qa_persona_password }} --insecure-skip-tls-verify"
      changed_when: false
      no_log: true

    - name: Capture persona API token
      ansible.builtin.command: oc whoami -t
      register: _oc_token
      changed_when: false
      no_log: true

    - name: Set k8s auth to the persona identity
      ansible.builtin.set_fact:
        _k8s_host: "{{ _api_url }}"
        _k8s_api_key: "{{ _oc_token.stdout }}"
        _k8s_validate_certs: false
      no_log: true

    # --- TPA deployed -----------------------------------------------------
    - name: Get TPA server route
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ ns_tpa }}"
      register: r_tpa_routes
      ignore_errors: true

    - name: Select TPA server route host
      ansible.builtin.set_fact:
        _tpa_host: >-
          {{ (r_tpa_routes.resources | selectattr('spec.host', 'search', 'server')
              | list | first | default(r_tpa_routes.resources | first | default({}))).spec.host
             | default('') }}
      when: r_tpa_routes.resources | default([]) | length > 0

    - name: Record TPA route missing
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['No TPA routes found in ' + ns_tpa] }}"
      when: r_tpa_routes.resources | default([]) | length == 0

    - name: HTTP-check TPA UI
      ansible.builtin.uri:
        url: "https://{{ _tpa_host }}"
        method: GET
        validate_certs: false
        status_code: [200, 302, 401, 403]
        timeout: 20
      register: r_tpa_http
      when: _tpa_host | default('') | length > 0
      ignore_errors: true

    - name: Record TPA UI unreachable
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['TPA UI did not respond'] }}"
      when:
        - _tpa_host | default('') | length > 0
        - r_tpa_http is defined
        - r_tpa_http is failed

    # --- Outcome: TPA actually holds the parasol SBOM --------------------
    # The current M06 "does /api/v2/sbom answer" check passes even with zero
    # SBOMs. The real Module 6 outcome is that the SBOM the secured pipeline
    # built and uploaded is browsable in TPA. We authenticate with the in-
    # cluster tpa-cli service-account client and assert a parasol SBOM exists.
    - name: Authenticate to TPA and assert a parasol SBOM is present
      when: _tpa_host | default('') | length > 0
      block:
        - name: Read tpa-cli OIDC client secret
          kubernetes.core.k8s_info:
            host: "{{ _k8s_host | default(omit, true) }}"
            api_key: "{{ _k8s_api_key | default(omit, true) }}"
            validate_certs: "{{ _k8s_validate_certs }}"
            api_version: v1
            kind: Secret
            namespace: "{{ ns_tpa }}"
            name: oidc-tpa-cli
          register: r_tpa_cli_secret
          no_log: true

        - name: Derive the Keycloak issuer from the TPA route domain
          ansible.builtin.set_fact:
            # server-xxx.apps.<domain>  ->  https://sso.apps.<domain>/realms/backstage
            _tpa_issuer: "https://sso.{{ _tpa_host.split('.', 1)[1] }}/realms/backstage"
            _tpa_client_secret: "{{ r_tpa_cli_secret.resources[0].data['client-secret'] | b64decode }}"
          no_log: true

        - name: Mint a TPA token (tpa-cli client_credentials)
          ansible.builtin.uri:
            url: "{{ _tpa_issuer }}/protocol/openid-connect/token"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: client_credentials
              client_id: tpa-cli
              client_secret: "{{ _tpa_client_secret }}"
            validate_certs: false
            status_code: [200]
          register: r_tpa_token
          no_log: true

        - name: Query TPA for the parasol SBOM
          ansible.builtin.uri:
            url: "https://{{ _tpa_host }}/api/v2/sbom?q={{ tpa_sbom_match }}&limit=10"
            method: GET
            headers:
              Authorization: "Bearer {{ r_tpa_token.json.access_token }}"
            validate_certs: false
            status_code: [200]
            timeout: 30
          register: r_tpa_sbom

        - name: Record no parasol SBOM in TPA
          ansible.builtin.set_fact:
            e2e_failures: >-
              {{ e2e_failures + ['No SBOM matching "' + tpa_sbom_match +
                 '" found in TPA — the secured tag-promote pipeline (Module 5) has not uploaded one'] }}
          when: (r_tpa_sbom.json.total | default(0) | int) == 0

    - name: Record TPA auth/query failed
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['Could not authenticate to TPA or query the SBOM API'] }}"
      when:
        - _tpa_host | default('') | length > 0
        - (r_tpa_token is defined and r_tpa_token is failed) or (r_tpa_sbom is defined and r_tpa_sbom is failed)

    # --- Summary --------------------------------------------------------
    - name: "Module 06 — PASSED"
      ansible.builtin.debug:
        msg: "Supply chain outcomes verified (TPA up and serving SBOM API)."
      when: e2e_failures | length == 0

    - name: "Module 06 — FAILED"
      ansible.builtin.fail:
        msg: |
          {{ e2e_failures | length }} issue(s):
          {% for f in e2e_failures %}  - {{ f }}
          {% endfor %}
      when: e2e_failures | length > 0
