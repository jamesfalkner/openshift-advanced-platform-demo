---
# =============================================================================
# E2E — Module 06: Trusted software supply chain (TPA)
# =============================================================================
#
# Demo outcomes being validated (not the UI clicks):
#   - Trusted Profile Analyzer (TPA) is deployed and its UI/API answers.
#   - The TPA API serves SBOM / vulnerability data (the inventory the presenter
#     browses, searches by license, and drills into CVEs).
#
# Browsing SBOMs, filtering by license, and inspecting CVE dependency trees are
# visual; the backing fact is that TPA is up and its SBOM API returns data.
# =============================================================================

- name: "E2E Module 06: Trusted software supply chain"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _api_url: "{{ (ocp_api_url | default('')) or (openshift_api_url | default('')) or (openshift_api_server_url | default('')) }}"
    # Konflux logic: in the Showroom runner no admin password is passed, so we
    # authenticate with the runtime-automation SA token (which provisioning binds
    # to cluster-admin). Only when ocp_admin_password is supplied (local CLI) do
    # we fall back to an oc login.
    _use_sa_token: "{{ ocp_admin_password is not defined }}"
    showroom_namespace: "{{ lookup('file', '/var/run/secrets/kubernetes.io/serviceaccount/namespace', errors='ignore') | default('showroom', true) }}"
    showroom_sa_secret: runtime-automation-token
    ns_tpa: trusted-profile-analyzer
    e2e_failures: []

  tasks:
    # --- Auth -------------------------------------------------------------
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - _api_url | length > 0
        fail_msg: "Pass ocp_api_url + ocp_admin_password (CLI) or run in the Showroom runner."

    - name: Get runtime-automation SA token (runner mode)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ showroom_namespace }}"
        name: "{{ showroom_sa_secret }}"
      register: _ra_secret
      when: _use_sa_token | bool

    - name: Set k8s auth (runner mode)
      ansible.builtin.set_fact:
        _k8s_host: "{{ _api_url }}"
        _k8s_api_key: "{{ _ra_secret.resources[0].data.token | b64decode }}"
        _k8s_validate_certs: false
      when: _use_sa_token | bool
      no_log: true

    - name: Login to OpenShift (CLI mode)
      ansible.builtin.command:
        cmd: "oc login {{ _api_url }} --username admin --password {{ ocp_admin_password }} --insecure-skip-tls-verify"
      changed_when: false
      no_log: true
      when: not (_use_sa_token | bool)

    - name: Capture admin API token (CLI mode)
      ansible.builtin.command: oc whoami -t
      register: _oc_token
      changed_when: false
      no_log: true
      when: not (_use_sa_token | bool)

    - name: Set k8s auth (CLI mode)
      ansible.builtin.set_fact:
        _k8s_host: "{{ _api_url }}"
        _k8s_api_key: "{{ _oc_token.stdout }}"
        _k8s_validate_certs: false
      when: not (_use_sa_token | bool)

    # --- TPA deployed -----------------------------------------------------
    - name: Get TPA server route
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ ns_tpa }}"
      register: r_tpa_routes
      ignore_errors: true

    - name: Select TPA server route host
      ansible.builtin.set_fact:
        _tpa_host: >-
          {{ (r_tpa_routes.resources | selectattr('spec.host', 'search', 'server')
              | list | first | default(r_tpa_routes.resources | first | default({}))).spec.host
             | default('') }}
      when: r_tpa_routes.resources | default([]) | length > 0

    - name: Record TPA route missing
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['No TPA routes found in ' + ns_tpa] }}"
      when: r_tpa_routes.resources | default([]) | length == 0

    - name: HTTP-check TPA UI
      ansible.builtin.uri:
        url: "https://{{ _tpa_host }}"
        method: GET
        validate_certs: false
        status_code: [200, 302, 401, 403]
        timeout: 20
      register: r_tpa_http
      when: _tpa_host | default('') | length > 0
      ignore_errors: true

    - name: Record TPA UI unreachable
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['TPA UI did not respond'] }}"
      when:
        - _tpa_host | default('') | length > 0
        - r_tpa_http is defined
        - r_tpa_http is failed

    # --- TPA SBOM API serves data ----------------------------------------
    - name: Query TPA SBOM API
      ansible.builtin.uri:
        url: "https://{{ _tpa_host }}/api/v2/sbom?limit=1"
        method: GET
        validate_certs: false
        status_code: [200, 401, 403]
        timeout: 30
      register: r_tpa_sbom
      when: _tpa_host | default('') | length > 0
      ignore_errors: true

    - name: Record TPA SBOM API not reachable
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['TPA SBOM API (/api/v2/sbom) did not respond'] }}"
      when:
        - _tpa_host | default('') | length > 0
        - r_tpa_sbom is defined
        - r_tpa_sbom is failed

    # --- Summary --------------------------------------------------------
    - name: "Module 06 — PASSED"
      ansible.builtin.debug:
        msg: "Supply chain outcomes verified (TPA up and serving SBOM API)."
      when: e2e_failures | length == 0

    - name: "Module 06 — FAILED"
      ansible.builtin.fail:
        msg: |
          {{ e2e_failures | length }} issue(s):
          {% for f in e2e_failures %}  - {{ f }}
          {% endfor %}
      when: e2e_failures | length > 0
