---
# =============================================================================
# E2E — Module 04: Developer Hub and Software Catalog
# =============================================================================
#
# Demo outcomes being validated (not the UI clicks):
#   - Red Hat Developer Hub (Backstage) is deployed and its route answers.
#   - The software catalog / scaffolder API is reachable.
#   - The self-service template used by the demo ("Parasol Insurance Secured
#     Development") is registered — this is what powers Module 4 & 7 provisioning.
#
# Developer Lightspeed and the "explore the catalog" clicks are visual; the
# machine-checkable backing fact is that RHDH + the template are present.
# =============================================================================

- name: "E2E Module 04: Developer Hub"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _api_url: "{{ (ocp_api_url | default('')) or (openshift_api_url | default('')) or (openshift_api_server_url | default('')) }}"
    # Konflux logic: in the Showroom runner no admin password is passed, so we
    # authenticate with the runtime-automation SA token (which provisioning binds
    # to cluster-admin). Only when ocp_admin_password is supplied (local CLI) do
    # we fall back to an oc login.
    _use_sa_token: "{{ ocp_admin_password is not defined }}"
    showroom_namespace: "{{ lookup('file', '/var/run/secrets/kubernetes.io/serviceaccount/namespace', errors='ignore') | default('showroom', true) }}"
    showroom_sa_secret: runtime-automation-token
    ns_rhdh: rhdh
    rhdh_route_name: backstage-developer-hub
    template_match: "secured development"
    e2e_failures: []

  tasks:
    # --- Auth -------------------------------------------------------------
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - _api_url | length > 0
        fail_msg: "Pass ocp_api_url + ocp_admin_password (CLI) or run in the Showroom runner."

    - name: Get runtime-automation SA token (runner mode)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ showroom_namespace }}"
        name: "{{ showroom_sa_secret }}"
      register: _ra_secret
      when: _use_sa_token | bool

    - name: Set k8s auth (runner mode)
      ansible.builtin.set_fact:
        _k8s_host: "{{ _api_url }}"
        _k8s_api_key: "{{ _ra_secret.resources[0].data.token | b64decode }}"
        _k8s_validate_certs: false
      when: _use_sa_token | bool
      no_log: true

    - name: Login to OpenShift (CLI mode)
      ansible.builtin.command:
        cmd: "oc login {{ _api_url }} --username admin --password {{ ocp_admin_password }} --insecure-skip-tls-verify"
      changed_when: false
      no_log: true
      when: not (_use_sa_token | bool)

    - name: Capture admin API token (CLI mode)
      ansible.builtin.command: oc whoami -t
      register: _oc_token
      changed_when: false
      no_log: true
      when: not (_use_sa_token | bool)

    - name: Set k8s auth (CLI mode)
      ansible.builtin.set_fact:
        _k8s_host: "{{ _api_url }}"
        _k8s_api_key: "{{ _oc_token.stdout }}"
        _k8s_validate_certs: false
      when: not (_use_sa_token | bool)

    # --- RHDH deployment ready -------------------------------------------
    - name: Get RHDH deployments
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ ns_rhdh }}"
      register: r_rhdh_deploys
      ignore_errors: true

    - name: Record RHDH not running
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['No available Deployments in ' + ns_rhdh + ' — Developer Hub not running'] }}"
      when: >-
        r_rhdh_deploys.resources | default([]) | length == 0
        or (r_rhdh_deploys.resources | selectattr('status.availableReplicas', 'defined')
            | selectattr('status.availableReplicas', 'ge', 1) | list | length == 0)

    # --- RHDH route + catalog API ---------------------------------------
    - name: Get RHDH route
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ ns_rhdh }}"
        name: "{{ rhdh_route_name }}"
      register: r_rhdh_route
      ignore_errors: true

    - name: Record RHDH route missing
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['RHDH route ' + ns_rhdh + '/' + rhdh_route_name + ' not found'] }}"
      when: r_rhdh_route.resources | default([]) | length == 0

    - name: Query RHDH catalog templates API
      ansible.builtin.uri:
        url: "https://{{ r_rhdh_route.resources[0].spec.host }}/api/catalog/entities?filter=kind=template"
        method: GET
        validate_certs: false
        return_content: true
        status_code: [200, 401, 403]
        timeout: 30
      register: r_templates
      when: r_rhdh_route.resources | default([]) | length > 0
      ignore_errors: true

    - name: Record catalog API unreachable
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['RHDH catalog API did not respond'] }}"
      when:
        - r_templates is defined
        - r_templates is failed

    # Only assert the template name when the API returned entities (200).
    - name: Record expected software template missing
      ansible.builtin.set_fact:
        e2e_failures: >-
          {{ e2e_failures + ['Software template matching "' + template_match +
             '" not found in RHDH catalog'] }}
      when:
        - r_templates is defined
        - r_templates is not skipped
        - (r_templates.status | default(0)) == 200
        - template_match not in (r_templates.content | default('') | lower)

    # --- Summary --------------------------------------------------------
    - name: "Module 04 — PASSED"
      ansible.builtin.debug:
        msg: "Developer Hub outcomes verified (RHDH up, catalog + template reachable)."
      when: e2e_failures | length == 0

    - name: "Module 04 — FAILED"
      ansible.builtin.fail:
        msg: |
          {{ e2e_failures | length }} issue(s):
          {% for f in e2e_failures %}  - {{ f }}
          {% endfor %}
      when: e2e_failures | length > 0
