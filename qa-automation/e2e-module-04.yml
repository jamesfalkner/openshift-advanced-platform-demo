---
# =============================================================================
# E2E — Module 04: Developer Hub and Software Catalog
# =============================================================================
#
# Module 4's user outcome: the developer opens Developer Hub, runs the
# "Onboarding features on Parasol Insurance application" software template with
# a branch name, and the platform provisions a feature branch, a per-feature
# GitOps repo, an Argo CD application, and a registered catalog component.
#
# The e2e drives the SAME scaffolder template (not the UI clicks) and asserts
# those artifacts exist. Because the deployed template sources the owner from
# the logged-in user's identity (user.entity.*) and the e2e calls the API with
# a service token (no user entity), we first patch the template in GitLab so
# user.entity.* falls back to optional owner/owner_email parameters. The patch
# is backward compatible (real users are unaffected) and idempotent. This runs
# the real template end-to-end, so the produced cluster state is identical to a
# developer running it as dev1.
#
# NOTE: this is a MUTATING test intended for a dedicated e2e cluster. It leaves
# the onboarded feature environment in place (the Module 4 outcome).
# =============================================================================

- name: "E2E Module 04: Developer Hub"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _api_url: "{{ (ocp_api_url | default('')) or (openshift_api_url | default('')) or (openshift_api_server_url | default('')) }}"
    qa_persona: pe1
    qa_persona_password: "{{ common_password | default('openshift') }}"
    ns_rhdh: rhdh
    ns_gitlab: gitlab
    ns_argocd: rhdh-gitops
    rhdh_route_name: backstage-developer-hub
    # RHDH static external-access token (subject api-clients) used to call the
    # catalog/scaffolder API without a browser login.
    rhdh_backend_secret: backend-secret
    # GitLab root token used to patch the template repo.
    gitlab_root_secret: root-user-personal-token
    template_repo_ref: "rhdh%2Frhdh-templates"
    template_file_path: "templates/parasol-insurance-secured/template.yaml"
    template_entity_ref: "template:default/parasol-insurance-secured-dev"
    # The developer persona + feature the e2e onboards (hardcoded owner since we
    # drive the scaffolder headlessly rather than as a logged-in user).
    m4_owner: dev1
    m4_owner_email: dev1@rhdh.com
    m4_branch: qae2e
    scaffolder_retries: 40
    scaffolder_delay: 8
    e2e_failures: []

  tasks:
    # --- Auth -------------------------------------------------------------
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - _api_url | length > 0
        fail_msg: "Pass ocp_api_url + ocp_admin_password (CLI) or run in the Showroom runner."

    - name: Log in to OpenShift as the demo persona ({{ qa_persona }})
      ansible.builtin.command:
        cmd: "oc login {{ _api_url }} --username {{ qa_persona }} --password {{ qa_persona_password }} --insecure-skip-tls-verify"
      changed_when: false
      no_log: true

    - name: Capture persona API token
      ansible.builtin.command: oc whoami -t
      register: _oc_token
      changed_when: false
      no_log: true

    - name: Set k8s auth to the persona identity
      ansible.builtin.set_fact:
        _k8s_host: "{{ _api_url }}"
        _k8s_api_key: "{{ _oc_token.stdout }}"
        _k8s_validate_certs: false
      no_log: true

    # --- RHDH deployment ready -------------------------------------------
    - name: Get RHDH deployments
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ ns_rhdh }}"
      register: r_rhdh_deploys
      ignore_errors: true

    - name: Record RHDH not running
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['No available Deployments in ' + ns_rhdh + ' — Developer Hub not running'] }}"
      when: >-
        r_rhdh_deploys.resources | default([]) | length == 0
        or (r_rhdh_deploys.resources | selectattr('status.availableReplicas', 'defined')
            | selectattr('status.availableReplicas', 'ge', 1) | list | length == 0)

    - name: Get RHDH route
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: route.openshift.io/v1
        kind: Route
        namespace: "{{ ns_rhdh }}"
        name: "{{ rhdh_route_name }}"
      register: r_rhdh_route
      ignore_errors: true

    - name: Record RHDH route missing
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['RHDH route ' + ns_rhdh + '/' + rhdh_route_name + ' not found'] }}"
      when: r_rhdh_route.resources | default([]) | length == 0

    # --- Outcome: run the self-service onboarding template ----------------
    - name: Onboard a feature via the RHDH scaffolder template
      when: r_rhdh_route.resources | default([]) | length > 0
      block:
        - name: Set RHDH URL
          ansible.builtin.set_fact:
            _rhdh_url: "https://{{ r_rhdh_route.resources[0].spec.host }}"

        - name: Read RHDH static external-access token
          kubernetes.core.k8s_info:
            host: "{{ _k8s_host | default(omit, true) }}"
            api_key: "{{ _k8s_api_key | default(omit, true) }}"
            validate_certs: "{{ _k8s_validate_certs }}"
            api_version: v1
            kind: Secret
            namespace: "{{ ns_rhdh }}"
            name: "{{ rhdh_backend_secret }}"
          register: r_bk
          no_log: true

        - name: Set RHDH token
          ansible.builtin.set_fact:
            _rhdh_token: "{{ r_bk.resources[0].data.BACKEND_SECRET | b64decode }}"
          no_log: true

        - name: Get GitLab route
          kubernetes.core.k8s_info:
            host: "{{ _k8s_host | default(omit, true) }}"
            api_key: "{{ _k8s_api_key | default(omit, true) }}"
            validate_certs: "{{ _k8s_validate_certs }}"
            api_version: route.openshift.io/v1
            kind: Route
            namespace: "{{ ns_gitlab }}"
            name: gitlab
          register: r_gl_route

        - name: Read GitLab root token
          kubernetes.core.k8s_info:
            host: "{{ _k8s_host | default(omit, true) }}"
            api_key: "{{ _k8s_api_key | default(omit, true) }}"
            validate_certs: "{{ _k8s_validate_certs }}"
            api_version: v1
            kind: Secret
            namespace: "{{ ns_gitlab }}"
            name: "{{ gitlab_root_secret }}"
          register: r_glt
          no_log: true

        - name: Set GitLab facts
          ansible.builtin.set_fact:
            _gl_host: "{{ r_gl_route.resources[0].spec.host }}"
            _gl_token: "{{ r_glt.resources[0].data.token | b64decode }}"
          no_log: true

        # Idempotency: the per-feature GitOps repo existing means this feature
        # was already onboarded; skip the scaffolder and just assert the outcome.
        - name: Check if the feature was already onboarded
          ansible.builtin.uri:
            url: "https://{{ _gl_host }}/api/v4/projects/{{ m4_owner }}%2Fparasol-insurance-secured-{{ m4_branch }}-gitops"
            method: GET
            headers:
              PRIVATE-TOKEN: "{{ _gl_token }}"
            validate_certs: false
            status_code: [200, 404]
          register: r_gitops_exists

        - name: Run the scaffolder (only if not already onboarded)
          when: (r_gitops_exists.status | default(404)) != 200
          block:
            - name: Write the template-patch script
              ansible.builtin.copy:
                dest: /tmp/m4_patch_template.py
                mode: "0700"
                content: !unsafe |
                  import os, sys, json, ssl, urllib.request, urllib.parse
                  host = os.environ['GL_HOST']; tok = os.environ['GL_TOKEN']
                  proj = urllib.parse.quote(os.environ['TPL_REPO'], safe='')
                  path = urllib.parse.quote(os.environ['TPL_PATH'], safe='')
                  base = "https://%s/api/v4/projects/%s/repository/files/%s" % (host, proj, path)
                  ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE
                  def call(url, method='GET', data=None):
                      r = urllib.request.Request(url, data=data, method=method,
                          headers={'PRIVATE-TOKEN': tok, 'Content-Type': 'application/json'})
                      return urllib.request.urlopen(r, context=ctx)
                  raw = call(base + "/raw?ref=main").read().decode()
                  if 'parameters.owner or user.entity' in raw:
                      print('already-patched'); sys.exit(0)
                  anchor = '          description: Branch name in the parasol-insurance source repo'
                  add = anchor + "\n" + \
                      '        owner:\n' \
                      '          title: Owner (e2e only)\n' \
                      '          type: string\n' \
                      '          description: Overrides the logged-in user as owner (qa-automation e2e)\n' \
                      '        owner_email:\n' \
                      '          title: Owner email (e2e only)\n' \
                      '          type: string\n' \
                      '          description: Overrides the logged-in user email (qa-automation e2e)'
                  s = raw.replace(anchor, add, 1)
                  s = s.replace('${{ user.entity.metadata.name }}', '${{ parameters.owner or user.entity.metadata.name }}')
                  s = s.replace('${{ user.entity.spec.profile.email }}', '${{ parameters.owner_email or user.entity.spec.profile.email }}')
                  body = json.dumps({'branch': 'main',
                      'commit_message': 'qa-e2e: parameterize owner/email for headless scaffolder',
                      'content': s}).encode()
                  call(base, 'PUT', body)
                  print('patched')

            - name: Patch the template so owner/email fall back to parameters
              ansible.builtin.command: python3 /tmp/m4_patch_template.py
              environment:
                GL_HOST: "{{ _gl_host }}"
                GL_TOKEN: "{{ _gl_token }}"
                TPL_REPO: "rhdh/rhdh-templates"
                TPL_PATH: "{{ template_file_path }}"
              register: r_patch
              changed_when: "'patched' in r_patch.stdout"
              no_log: true

            - name: Refresh the template entity in the RHDH catalog
              ansible.builtin.uri:
                url: "{{ _rhdh_url }}/api/catalog/refresh"
                method: POST
                headers:
                  Authorization: "Bearer {{ _rhdh_token }}"
                body_format: json
                body:
                  entityRef: "{{ template_entity_ref }}"
                validate_certs: false
                status_code: [200, 201, 204]

            - name: Wait until the template exposes the owner parameter
              ansible.builtin.uri:
                url: "{{ _rhdh_url }}/api/catalog/entities/by-name/template/default/parasol-insurance-secured-dev"
                method: GET
                headers:
                  Authorization: "Bearer {{ _rhdh_token }}"
                validate_certs: false
                return_content: true
                status_code: [200]
              register: r_tpl_check
              until: >-
                '"owner"' in (r_tpl_check.content | default(''))
              retries: 20
              delay: 6

            - name: Invoke the scaffolder (run the onboarding template)
              ansible.builtin.uri:
                url: "{{ _rhdh_url }}/api/scaffolder/v2/tasks"
                method: POST
                headers:
                  Authorization: "Bearer {{ _rhdh_token }}"
                body_format: json
                body:
                  templateRef: "{{ template_entity_ref }}"
                  values:
                    branch: "{{ m4_branch }}"
                    owner: "{{ m4_owner }}"
                    owner_email: "{{ m4_owner_email }}"
                validate_certs: false
                status_code: [200, 201]
              register: r_task

            - name: Wait for the scaffolder task to finish
              ansible.builtin.uri:
                url: "{{ _rhdh_url }}/api/scaffolder/v2/tasks/{{ r_task.json.id }}"
                method: GET
                headers:
                  Authorization: "Bearer {{ _rhdh_token }}"
                validate_certs: false
                status_code: [200]
              register: r_task_status
              until: (r_task_status.json.status | default('')) in ['completed', 'failed', 'cancelled']
              retries: "{{ scaffolder_retries }}"
              delay: "{{ scaffolder_delay }}"

            - name: Record scaffolder task did not complete
              ansible.builtin.set_fact:
                e2e_failures: >-
                  {{ e2e_failures + ['Onboarding template task ended with status=' +
                     (r_task_status.json.status | default('unknown'))] }}
              when: (r_task_status.json.status | default('')) != 'completed'

        # --- Assert the Module 4 outcome artifacts exist -----------------
        - name: Assert the feature branch exists on parasol-insurance
          ansible.builtin.uri:
            url: "https://{{ _gl_host }}/api/v4/projects/parasol%2Fparasol-insurance/repository/branches/{{ m4_branch }}"
            method: GET
            headers:
              PRIVATE-TOKEN: "{{ _gl_token }}"
            validate_certs: false
            status_code: [200, 404]
          register: r_branch_out
          until: (r_branch_out.status | default(404)) == 200
          retries: 10
          delay: 6
          ignore_errors: true

        - name: Record feature branch missing
          ansible.builtin.set_fact:
            e2e_failures: "{{ e2e_failures + ['Feature branch ' + m4_branch + ' was not created on parasol-insurance'] }}"
          when: (r_branch_out.status | default(404)) != 200

        - name: Assert the per-feature GitOps repo exists
          ansible.builtin.uri:
            url: "https://{{ _gl_host }}/api/v4/projects/{{ m4_owner }}%2Fparasol-insurance-secured-{{ m4_branch }}-gitops"
            method: GET
            headers:
              PRIVATE-TOKEN: "{{ _gl_token }}"
            validate_certs: false
            status_code: [200, 404]
          register: r_gitops_out
          until: (r_gitops_out.status | default(404)) == 200
          retries: 10
          delay: 6
          ignore_errors: true

        - name: Record GitOps repo missing
          ansible.builtin.set_fact:
            e2e_failures: >-
              {{ e2e_failures + ['GitOps repo ' + m4_owner + '/parasol-insurance-secured-' +
                 m4_branch + '-gitops was not created'] }}
          when: (r_gitops_out.status | default(404)) != 200

        - name: Assert the Argo CD bootstrap application was created
          kubernetes.core.k8s_info:
            host: "{{ _k8s_host | default(omit, true) }}"
            api_key: "{{ _k8s_api_key | default(omit, true) }}"
            validate_certs: "{{ _k8s_validate_certs }}"
            api_version: argoproj.io/v1alpha1
            kind: Application
            namespace: "{{ ns_argocd }}"
            name: "parasol-insurance-secured-{{ m4_owner }}-{{ m4_branch }}-bootstrap"
          register: r_argo_boot
          until: r_argo_boot.resources | default([]) | length > 0
          retries: 10
          delay: 6
          ignore_errors: true

        - name: Record Argo CD bootstrap application missing
          ansible.builtin.set_fact:
            e2e_failures: >-
              {{ e2e_failures + ['Argo CD app parasol-insurance-secured-' + m4_owner + '-' +
                 m4_branch + '-bootstrap was not created'] }}
          when: r_argo_boot.resources | default([]) | length == 0

    # --- Summary --------------------------------------------------------
    - name: "Module 04 — PASSED"
      ansible.builtin.debug:
        msg: >-
          Developer Hub outcome verified: onboarding template provisioned the
          feature branch, GitOps repo, and Argo CD application for '{{ m4_branch }}'.
      when: e2e_failures | length == 0

    - name: "Module 04 — FAILED"
      ansible.builtin.fail:
        msg: |
          {{ e2e_failures | length }} issue(s):
          {% for f in e2e_failures %}  - {{ f }}
          {% endfor %}
      when: e2e_failures | length > 0
