---
# =============================================================================
# E2E — Module 03: Platform operations
# =============================================================================
#
# Demo outcomes being validated (not the UI clicks):
#   - Traffic management / security: Service Mesh (Istio) control plane is Ready.
#   - Observability: Kiali is deployed and its route answers.
#   - Autoscaling: a HorizontalPodAutoscaler exists for the Parasol app.
#   - External secrets: Vault-backed ExternalSecrets are reconciled (Ready).
#
# Read-only. "Point out the graph / the scaled pods" are visual confirmations of
# these same facts, which we assert directly.
# =============================================================================

- name: "E2E Module 03: Platform operations"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _api_url: "{{ (ocp_api_url | default('')) or (openshift_api_url | default('')) or (openshift_api_server_url | default('')) }}"
    # The e2e MIMICS A REAL ATTENDEE: it authenticates as a demo persona (the
    # platform-engineer user `pe1` by default), NOT cluster-admin. pe1 has the
    # same console access a real user has (pipelines, Argo apps, routes, pods) plus
    # the platform-engineer actions used in the demo (e.g. the DevSpaces sample
    # ConfigMap). Override with -e qa_persona=dev1 if a module needs the developer.
    qa_persona: pe1
    qa_persona_password: "{{ common_password | default('openshift') }}"
    ns_dev: parasol-insurance-dev
    # The demo configures the HPA (parasol-insurance-hpa) on the PRODUCTION
    # deployment via GitOps (see Module 3 Part 3), so autoscaling is asserted in
    # the prod namespace, not dev.
    ns_prod: parasol-insurance-prod
    e2e_failures: []

  tasks:
    # --- Auth -------------------------------------------------------------
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - _api_url | length > 0
        fail_msg: "Pass ocp_api_url + ocp_admin_password (CLI) or run in the Showroom runner."

    - name: Log in to OpenShift as the demo persona ({{ qa_persona }})
      ansible.builtin.command:
        cmd: "oc login {{ _api_url }} --username {{ qa_persona }} --password {{ qa_persona_password }} --insecure-skip-tls-verify"
      changed_when: false
      no_log: true

    - name: Capture persona API token
      ansible.builtin.command: oc whoami -t
      register: _oc_token
      changed_when: false
      no_log: true

    - name: Set k8s auth to the persona identity
      ansible.builtin.set_fact:
        _k8s_host: "{{ _api_url }}"
        _k8s_api_key: "{{ _oc_token.stdout }}"
        _k8s_validate_certs: false
      no_log: true

    # --- Service Mesh control plane ready (Sail operator: kind Istio) -----
    - name: Get Istio control plane
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: sailoperator.io/v1
        kind: Istio
      register: r_istio
      ignore_errors: true

    - name: Record Service Mesh not Ready
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['Service Mesh (Istio) control plane not found or not Ready'] }}"
      when: >-
        r_istio.resources | default([]) | length == 0
        or (r_istio.resources[0].status.conditions | default([])
            | selectattr('type', 'equalto', 'Ready')
            | selectattr('status', 'equalto', 'True') | list | length == 0)

    # --- Kiali observability ---------------------------------------------
    - name: Get Kiali route
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: route.openshift.io/v1
        kind: Route
        namespace: istio-system
        name: kiali
      register: r_kiali_route
      ignore_errors: true

    - name: HTTP-check Kiali
      ansible.builtin.uri:
        url: "https://{{ r_kiali_route.resources[0].spec.host }}"
        method: GET
        validate_certs: false
        status_code: [200, 302, 401, 403]
        timeout: 20
      register: r_kiali_http
      when: r_kiali_route.resources | default([]) | length > 0
      ignore_errors: true

    - name: Record Kiali unreachable
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['Kiali route not found or not responding'] }}"
      when: >-
        r_kiali_route.resources | default([]) | length == 0
        or (r_kiali_http is defined and r_kiali_http is failed)

    # --- Autoscaling: drive the Module 3 Part 3 outcome -----------------
    # The user generates load against the prod app and watches the HPA add
    # replicas. We do the same: confirm the HPA exists, fire load at the app,
    # then assert currentReplicas climbs above minReplicas. The load generator
    # is always cleaned up.
    - name: Get HPA in prod namespace
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: autoscaling/v2
        kind: HorizontalPodAutoscaler
        namespace: "{{ ns_prod }}"
      register: r_hpa
      ignore_errors: true

    - name: Record no HPA configured
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['No HorizontalPodAutoscaler found in ' + ns_prod] }}"
      when: r_hpa.resources | default([]) | length == 0

    - name: Drive autoscaling with a load generator and assert scale-up
      when: r_hpa.resources | default([]) | length > 0
      block:
        - name: Record HPA min replicas baseline
          ansible.builtin.set_fact:
            _hpa_name: "{{ r_hpa.resources[0].metadata.name }}"
            _hpa_min: "{{ r_hpa.resources[0].spec.minReplicas | default(1) | int }}"

        - name: Launch load generator pod (mimics the demo's web-terminal command)
          kubernetes.core.k8s:
            host: "{{ _k8s_host | default(omit, true) }}"
            api_key: "{{ _k8s_api_key | default(omit, true) }}"
            validate_certs: "{{ _k8s_validate_certs }}"
            state: present
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: qa-load-generator
                namespace: "{{ ns_prod }}"
                labels:
                  app.kubernetes.io/name: qa-load-generator
              spec:
                restartPolicy: Never
                containers:
                  - name: load
                    image: quay.io/curl/curl:latest
                    command:
                      - /bin/sh
                      - -c
                      - >-
                        for i in $(seq 1 20); do
                          (while true; do
                             curl -s -o /dev/null -k
                             http://parasol-insurance.{{ ns_prod }}.svc:8080/api/claims;
                           done) &
                        done; wait

        - name: Wait for HPA to scale above min replicas
          kubernetes.core.k8s_info:
            host: "{{ _k8s_host | default(omit, true) }}"
            api_key: "{{ _k8s_api_key | default(omit, true) }}"
            validate_certs: "{{ _k8s_validate_certs }}"
            api_version: autoscaling/v2
            kind: HorizontalPodAutoscaler
            namespace: "{{ ns_prod }}"
            name: "{{ _hpa_name }}"
          register: r_hpa_scaled
          until: >-
            (r_hpa_scaled.resources[0].status.currentReplicas | default(0) | int) > (_hpa_min | int)
          retries: 40
          delay: 15
          ignore_errors: true

        - name: Record HPA did not scale up under load
          ansible.builtin.set_fact:
            e2e_failures: >-
              {{ e2e_failures + ['HPA ' + _hpa_name + ' did not scale above minReplicas (' +
                 _hpa_min + ') under load — currentReplicas=' +
                 (r_hpa_scaled.resources[0].status.currentReplicas | default(0) | string)] }}
          when: >-
            (r_hpa_scaled.resources[0].status.currentReplicas | default(0) | int) <= (_hpa_min | int)
      always:
        - name: Clean up load generator pod
          kubernetes.core.k8s:
            host: "{{ _k8s_host | default(omit, true) }}"
            api_key: "{{ _k8s_api_key | default(omit, true) }}"
            validate_certs: "{{ _k8s_validate_certs }}"
            state: absent
            api_version: v1
            kind: Pod
            namespace: "{{ ns_prod }}"
            name: qa-load-generator

    # --- External secrets reconciled ------------------------------------
    - name: Get ExternalSecrets
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: external-secrets.io/v1beta1
        kind: ExternalSecret
      register: r_es
      ignore_errors: true

    - name: Record ExternalSecrets not Ready
      ansible.builtin.set_fact:
        e2e_failures: >-
          {{ e2e_failures + ['ExternalSecret ' + item.metadata.namespace + '/' +
             item.metadata.name + ' not Ready'] }}
      loop: "{{ r_es.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
      when: >-
        item.status is not defined
        or (item.status.conditions | default([]) | selectattr('type', 'equalto', 'Ready')
            | selectattr('status', 'equalto', 'True') | list | length == 0)

    - name: Record no ExternalSecrets at all
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['No ExternalSecrets found — Vault integration missing'] }}"
      when: r_es.resources | default([]) | length == 0

    # --- Summary --------------------------------------------------------
    - name: "Module 03 — PASSED"
      ansible.builtin.debug:
        msg: "Platform operations outcomes verified (Mesh, Kiali, HPA, External Secrets)."
      when: e2e_failures | length == 0

    - name: "Module 03 — FAILED"
      ansible.builtin.fail:
        msg: |
          {{ e2e_failures | length }} issue(s):
          {% for f in e2e_failures %}  - {{ f }}
          {% endfor %}
      when: e2e_failures | length > 0
