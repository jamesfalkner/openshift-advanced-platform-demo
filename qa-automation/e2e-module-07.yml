---
# =============================================================================
# E2E — Module 07: AI-enhanced applications
# =============================================================================
#
# Demo outcome being validated (not the UI clicks):
#   LLM-powered email routing eliminates the "Review Required" bucket — every
#   incoming email is classified into CLAIMS / RETENTION / ACQUISITION.
#
# Instead of RHDH self-service → DevSpaces → git overlay → Source Control push,
# we drive the deterministic backend:
#   Prereqs (always):
#     - Vault-backed LLM credentials ExternalSecret is Ready.
#     - The prepared "llm-classification" branch exists in GitLab.
#     - (If configured) the external LiteLLM endpoint is reachable.
#   Outcome (only when qa_run_mutating=true):
#     - Merge llm-classification → main via the GitLab API (equivalent to the
#       demo's git overlay), wait for the pipeline + Argo CD, then GET the inbox
#       and assert NO "Review Required" entries remain.
#
# In non-mutating mode we verify the prerequisites only (safe for a shared
# instance), since a freshly provisioned app still uses keyword matching.
# =============================================================================

- name: "E2E Module 07: AI-enhanced applications"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _api_url: "{{ (ocp_api_url | default('')) or (openshift_api_url | default('')) or (openshift_api_server_url | default('')) }}"
    # The e2e MIMICS A REAL ATTENDEE: it authenticates as a demo persona (the
    # platform-engineer user `pe1` by default), NOT cluster-admin. pe1 has the
    # same console access a real user has (pipelines, Argo apps, routes, pods) plus
    # the platform-engineer actions used in the demo (e.g. the DevSpaces sample
    # ConfigMap). Override with -e qa_persona=dev1 if a module needs the developer.
    qa_persona: pe1
    qa_persona_password: "{{ common_password | default('openshift') }}"
    common_password: openshift
    qa_run_mutating: false
    # Personas (mimic the demo): the developer (dev2) overlays the LLM code and
    # opens the merge request; the platform engineer (pe1) approves/merges it.
    gitlab_dev_user: dev2
    gitlab_pe_user: pe1
    gitlab_project_ref: "parasol%2Fparasol-insurance"
    llm_branch: llm-classification
    ns_dev: parasol-insurance-dev
    argocd_ns: rhdh-gitops
    argocd_app_dev: parasol-insurance-dev
    inbox_path: "/api/emails"
    review_required_label: "review required"
    # External LiteLLM endpoint (optional; from user_data or -e)
    litellm_api_base_url: ""
    e2e_failures: []

  tasks:
    # --- Auth -------------------------------------------------------------
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - _api_url | length > 0
        fail_msg: "Pass ocp_api_url + ocp_admin_password (CLI) or run in the Showroom runner."

    - name: Log in to OpenShift as the demo persona ({{ qa_persona }})
      ansible.builtin.command:
        cmd: "oc login {{ _api_url }} --username {{ qa_persona }} --password {{ qa_persona_password }} --insecure-skip-tls-verify"
      changed_when: false
      no_log: true

    - name: Capture persona API token
      ansible.builtin.command: oc whoami -t
      register: _oc_token
      changed_when: false
      no_log: true

    - name: Set k8s auth to the persona identity
      ansible.builtin.set_fact:
        _k8s_host: "{{ _api_url }}"
        _k8s_api_key: "{{ _oc_token.stdout }}"
        _k8s_validate_certs: false
      no_log: true

    # --- Prereq: LLM credentials ExternalSecret Ready --------------------
    - name: Find LLM credentials ExternalSecret
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: external-secrets.io/v1beta1
        kind: ExternalSecret
      register: r_es
      ignore_errors: true

    - name: Record no LLM-related ExternalSecret Ready
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['No LLM/litellm ExternalSecret found in a Ready state'] }}"
      when: >-
        (r_es.resources | default([])
         | selectattr('metadata.name', 'search', '(?i)(llm|litellm)')
         | selectattr('status.conditions', 'defined') | list | length == 0)

    # --- Prereq: external LiteLLM endpoint reachable (optional) -----------
    - name: HTTP-check LiteLLM endpoint
      ansible.builtin.uri:
        url: "{{ litellm_api_base_url }}"
        method: GET
        validate_certs: false
        status_code: [200, 301, 302, 401, 403, 404]
        timeout: 20
      register: r_litellm
      when: litellm_api_base_url | length > 0
      ignore_errors: true

    - name: Record LiteLLM endpoint unreachable
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['External LiteLLM endpoint did not respond: ' + litellm_api_base_url] }}"
      when:
        - litellm_api_base_url | length > 0
        - r_litellm is defined
        - r_litellm is failed

    # --- GitLab token + prepared branch check ----------------------------
    - name: Get GitLab route
      kubernetes.core.k8s_info:
        host: "{{ _k8s_host | default(omit, true) }}"
        api_key: "{{ _k8s_api_key | default(omit, true) }}"
        validate_certs: "{{ _k8s_validate_certs }}"
        api_version: route.openshift.io/v1
        kind: Route
        namespace: gitlab
        name: gitlab
      register: r_gitlab_route
      ignore_errors: true

    - name: Set GitLab URL
      ansible.builtin.set_fact:
        _gitlab_url: "https://{{ r_gitlab_route.resources[0].spec.host }}"
      when: r_gitlab_route.resources | default([]) | length > 0

    - name: Mint GitLab API token as the developer ({{ gitlab_dev_user }})
      ansible.builtin.uri:
        url: "{{ _gitlab_url }}/oauth/token"
        method: POST
        body_format: json
        body:
          grant_type: password
          username: "{{ gitlab_dev_user }}"
          password: "{{ common_password }}"
        validate_certs: false
        status_code: [200]
      register: r_oauth
      when: _gitlab_url is defined
      no_log: true
      ignore_errors: true

    - name: Set GitLab token + project id
      when:
        - r_oauth is defined
        - r_oauth is not failed
      block:
        - name: Set token
          ansible.builtin.set_fact:
            _gitlab_token: "{{ r_oauth.json.access_token }}"
          no_log: true

        - name: Resolve project id
          ansible.builtin.uri:
            url: "{{ _gitlab_url }}/api/v4/projects/{{ gitlab_project_ref }}"
            method: GET
            headers:
              Authorization: "Bearer {{ _gitlab_token }}"
            validate_certs: false
            status_code: [200]
          register: r_project

        - name: Set project id
          ansible.builtin.set_fact:
            _project_id: "{{ r_project.json.id }}"

        - name: Check prepared llm-classification branch exists
          ansible.builtin.uri:
            url: "{{ _gitlab_url }}/api/v4/projects/{{ _project_id }}/repository/branches/{{ llm_branch }}"
            method: GET
            headers:
              Authorization: "Bearer {{ _gitlab_token }}"
            validate_certs: false
            status_code: [200, 404]
          register: r_branch

        - name: Record prepared branch missing
          ansible.builtin.set_fact:
            e2e_failures: "{{ e2e_failures + ['Prepared branch ' + llm_branch + ' not found in parasol-insurance'] }}"
          when: (r_branch.status | default(0)) != 200

    - name: Record GitLab not reachable
      ansible.builtin.set_fact:
        e2e_failures: "{{ e2e_failures + ['Could not reach/authenticate to GitLab to verify AI prerequisites'] }}"
      when: _gitlab_url is not defined or (r_oauth is defined and r_oauth is failed)

    # =====================================================================
    # Outcome: deploy the AI code and verify the inbox has no "Review
    # Required" left. Idempotent — if the LLM code is already on main (a
    # previous run merged it), we skip the merge and assert the inbox
    # directly, so the end state always matches the Module 7 outcome.
    # =====================================================================
    - name: Drive the AI outcome and assert inbox
      when:
        - _project_id is defined
        - (r_branch.status | default(0)) == 200
      block:
        - name: Check if the LLM classifier is already on main
          ansible.builtin.uri:
            url: "{{ _gitlab_url }}/api/v4/projects/{{ _project_id }}/repository/files/{{ 'src/main/java/com/parasol/EmailClassifier.java' | urlencode }}?ref=main"
            method: GET
            headers:
              Authorization: "Bearer {{ _gitlab_token }}"
            validate_certs: false
            status_code: [200, 404]
          register: r_llm_on_main

        - name: Enable LLM routing (merge llm-classification -> main)
          when: (r_llm_on_main.status | default(404)) != 200
          block:
            - name: Create MR llm-classification -> main
              ansible.builtin.uri:
                url: "{{ _gitlab_url }}/api/v4/projects/{{ _project_id }}/merge_requests"
                method: POST
                headers:
                  Authorization: "Bearer {{ _gitlab_token }}"
                body_format: json
                body:
                  source_branch: "{{ llm_branch }}"
                  target_branch: main
                  title: "qa-e2e: enable LLM email routing"
                validate_certs: false
                status_code: [201, 409]
              register: r_mr

            - name: Resolve open MR iid
              ansible.builtin.uri:
                url: "{{ _gitlab_url }}/api/v4/projects/{{ _project_id }}/merge_requests?state=opened&source_branch={{ llm_branch }}"
                method: GET
                headers:
                  Authorization: "Bearer {{ _gitlab_token }}"
                validate_certs: false
                status_code: [200]
              register: r_mr_list

            - name: Record no mergeable MR
              ansible.builtin.set_fact:
                e2e_failures: "{{ e2e_failures + ['Could not open an MR from ' + llm_branch + ' to main'] }}"
              when: r_mr_list.json | default([]) | length == 0

            # The platform engineer (pe1) approves/merges the MR — mint a pe1 token.
            - name: Mint GitLab API token as the platform engineer ({{ gitlab_pe_user }})
              ansible.builtin.uri:
                url: "{{ _gitlab_url }}/oauth/token"
                method: POST
                body_format: json
                body:
                  grant_type: password
                  username: "{{ gitlab_pe_user }}"
                  password: "{{ common_password }}"
                validate_certs: false
                status_code: [200]
              register: r_pe_oauth
              no_log: true
              when: r_mr_list.json | default([]) | length > 0

            - name: Merge the MR as the platform engineer
              ansible.builtin.uri:
                url: "{{ _gitlab_url }}/api/v4/projects/{{ _project_id }}/merge_requests/{{ r_mr_list.json[0].iid }}/merge"
                method: PUT
                headers:
                  Authorization: "Bearer {{ r_pe_oauth.json.access_token }}"
                validate_certs: false
                status_code: [200, 405, 406]
              register: r_merge
              when: r_mr_list.json | default([]) | length > 0

        - name: Wait for Argo CD dev app Synced + Healthy after merge
          kubernetes.core.k8s_info:
            host: "{{ _k8s_host | default(omit, true) }}"
            api_key: "{{ _k8s_api_key | default(omit, true) }}"
            validate_certs: "{{ _k8s_validate_certs }}"
            api_version: argoproj.io/v1alpha1
            kind: Application
            namespace: "{{ argocd_ns }}"
            name: "{{ argocd_app_dev }}"
          register: r_argo
          until:
            - r_argo.resources | length > 0
            - (r_argo.resources[0].status.sync.status | default('')) == 'Synced'
            - (r_argo.resources[0].status.health.status | default('')) == 'Healthy'
          retries: 90
          delay: 10
          # Only wait for a fresh sync if we actually merged this run.
          when: (r_llm_on_main.status | default(404)) != 200

        - name: Find Parasol dev route
          kubernetes.core.k8s_info:
            host: "{{ _k8s_host | default(omit, true) }}"
            api_key: "{{ _k8s_api_key | default(omit, true) }}"
            validate_certs: "{{ _k8s_validate_certs }}"
            api_version: route.openshift.io/v1
            kind: Route
            namespace: "{{ ns_dev }}"
          register: r_dev_routes

        - name: Select a parasol route host
          ansible.builtin.set_fact:
            _parasol_host: >-
              {{ (r_dev_routes.resources | selectattr('spec.host', 'search', 'parasol')
                  | list | first | default(r_dev_routes.resources | first)).spec.host }}

        # Give the AI classifier time to process the inbox after rollout, then
        # assert no "Review Required" remains. We retry because emails stream in.
        - name: Poll inbox until no "Review Required" remains
          ansible.builtin.uri:
            url: "https://{{ _parasol_host }}{{ inbox_path }}"
            method: GET
            validate_certs: false
            return_content: true
            status_code: [200]
          register: r_inbox
          until:
            - r_inbox.status == 200
            - review_required_label not in (r_inbox.content | default('') | lower)
          retries: 20
          delay: 15
          ignore_errors: true

        - name: Record inbox still has Review Required
          ansible.builtin.set_fact:
            e2e_failures: "{{ e2e_failures + ['Inbox still contains \"Review Required\" after enabling LLM routing'] }}"
          when:
            - r_inbox is defined
            - (r_inbox.status | default(0)) != 200
              or review_required_label in (r_inbox.content | default('') | lower)

    # --- Summary --------------------------------------------------------
    - name: "Module 07 — PASSED"
      ansible.builtin.debug:
        msg: "AI application outcomes verified."
      when: e2e_failures | length == 0

    - name: "Module 07 — FAILED"
      ansible.builtin.fail:
        msg: |
          {{ e2e_failures | length }} issue(s):
          {% for f in e2e_failures %}  - {{ f }}
          {% endfor %}
      when: e2e_failures | length > 0
