nameOverride: ""

serviceMesh:
  channel: stable-3.2
  installPlanApproval: Automatic
  name: servicemeshoperator3
  source: redhat-operators
  sourceNamespace: openshift-marketplace

kiali:
  channel: stable
  installPlanApproval: Automatic
  name: kiali-ossm
  source: redhat-operators
  sourceNamespace: openshift-marketplace

istio:
  namespace: istio-system
  discoverySelector:
    matchLabels:
      istio.io/dataplane-mode: ambient

istioCni:
  namespace: istio-cni

ztunnel:
  namespace: ztunnel

# Required for Istio ambient mode on OVN-Kubernetes. Routes kubelet traffic
# through the host network so ztunnel does not intercept liveness/readiness
# probes. Set to false on non-OVN clusters (e.g. OpenShiftSDN).
ovn:
  routingViaHost: true
