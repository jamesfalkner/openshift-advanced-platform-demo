gitlab:
  image: quay.io/redhat-gpte/gitlab:17.4.1
  email:
    address: "gitlab@rhdemo.com"
    displayName: "GitLab Admin"
    replyTo: "noreply@rhdemo.com"
  smtp:
    enabled: "false"
    domain: "rhdemo.com"
    host:
    port: "587"
    user: "gitlab"
    password: "gitlab"
  ssh:
    host:
    port: "22"
  rootPassword:
  host:
  https: "true"
  rootEmail: "root@rhdemo.com"
  keyBase:
    db: "0123456789"
    otp: "0123456789"
    secret: "0123456789"
  users:
    users:
      - id: dev1
        name: Dave Developer
      - id: dev2
        name: Divya Developer
      - id: pe1
        name: Paul PlatEngineer
      - id: pe2
        name: Priya PlatEngineer
    password: 
  groups:
    - name: rhdh
      repo:
        - name: developer-hub-config
          url: https://github.com/redhat-ads-tech/ocp-app-platform-demo-developer-hub-config.git
        - name: template-developer-self-service
          url: https://github.com/redhat-pe-workshop/rhdh-template-developer-self-service.git
        - name: devfiles
          url: https://github.com/redhat-ads-tech/devfiles.git
          fileOverrides:
            - path: devfile.yaml
              content: |
                schemaVersion: 2.2.0
                metadata:
                  name: default-devfile
                components:
                  - name: development-tooling
                    container:
                      image: registry.redhat.io/devspaces/udi-rhel9:3.26.1
                      env:
                        - name: QUARKUS_HTTP_HOST
                          value: 0.0.0.0
                        - name: MAVEN_OPTS
                          value: "-Dmaven.repo.local=/home/user/.m2/repository"
                        - name: DOCKER_HOST
                          value: unix:///tmp/podman.sock
                        - name: TESTCONTAINERS_RYUK_DISABLED
                          value: "true"
                        - name: HOST_USERS
                          value: "false"
                        - name: QUARKUS_ANALYTICS_DISABLED
                          value: "true"
                        - name: CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS
                          value: "1"
                      memoryLimit: 5Gi
                      cpuLimit: 2500m
                      volumeMounts:
                        - name: m2
                          path: /home/user/.m2
                      endpoints:
                        - name: quarkus-dev
                          targetPort: 8080
                          exposure: public
                          secure: false
                          protocol: https
                        - name: debug
                          targetPort: 5005
                          exposure: none
                          secure: false
                          protocol: tcp
                        - name: tests
                          targetPort: 8081
                          exposure: none
                          secure: false
                          protocol: tcp
                  - name: m2
                    volume:
                      size: 1G
                commands:
                  - id: package
                    exec:
                      label: "1. Package the application"
                      component: development-tooling
                      commandLine: "./mvnw package"
                      group:
                        kind: build
                        isDefault: true
                  - id: start-dev
                    exec:
                      label: "2. Start Development mode (Hot reload + debug)"
                      component: development-tooling
                      commandLine: "./mvnw compile quarkus:dev -Dquarkus.analytics.disabled=true"
                      group:
                        kind: run
                        isDefault: true
                  - id: init-podman-socket
                    exec:
                      label: "Start podman socket"
                      component: development-tooling
                      commandLine: |
                        /usr/bin/podman.orig system service --time=0 unix:///tmp/podman.sock &
                        sleep 2
                        if [ -S /tmp/podman.sock ]; then
                          echo "Podman socket ready"
                        else
                          echo "WARNING: Podman socket not created"
                        fi
                      group:
                        kind: build
                  - id: init-claude
                    exec:
                      label: "Install Claude CLI and config"
                      component: development-tooling
                      commandLine: |
                        curl -fsSL https://claude.ai/install.sh -o /tmp/claude-install.sh
                        chmod +x /tmp/claude-install.sh
                        /tmp/claude-install.sh
                        cp /home/user/.claude-config/.claude.json /home/user/.claude.json
                      group:
                        kind: build
                  - id: configure-settings
                    exec:
                      label: "Configure editor settings"
                      component: development-tooling
                      commandLine: |
                        jq '. + {"zoo-code.autoImportSettingsPath": "/home/user/.zoo-code/zoo-code-settings.json", "claudeCode.useTerminal": true}' \
                          /checode/remote/data/Machine/settings.json > /tmp/settings.json && \
                          mv /tmp/settings.json /checode/remote/data/Machine/settings.json
                      group:
                        kind: build
                events:
                  postStart:
                    - init-podman-socket
                    - init-claude
                    - configure-settings
        - name: rhdh-templates
          url: https://github.com/redhat-ads-tech/ocp-app-platform-demo-rhdh-templates.git
        - name: helm-charts
          url: https://github.com/redhat-ads-tech/ocp-app-platform-demo-apps-helm.git
        - name: infra-app-of-apps
          url: https://github.com/redhat-ads-tech/ocp-app-platform-demo-infra-app-of-apps.git
      users:
        - id: pe1
        - id: pe2
      project:
        - name: orchestrator-approvals
          labels:
            - name: approved
              color: green
            - name: denied
              color: red        
    - name: devteam1
      repo: []
      users:
        - id: dev1
        - id: dev2
    - name: parasol
      repo:
        - name: parasol-insurance
          url: https://github.com/redhat-ads-tech/parasol-insurance.git
          fileOverrides:
            - path: .vscode/extensions.json
              content: |
                {
                  "recommendations": [
                    "redhat.java",
                    "ZooCodeOrganization.zoo-code",
                    "redhat.vscode-yaml",
                    "redhat.vscode-quarkus",
                    "redhat.fabric8-analytics"
                  ]
                }
        - name: parasol-insurance-manifests
          url: https://github.com/redhat-ads-tech/parasol-insurance-manifests.git
        - name: parasol-insurance-secured-manifests
          url: https://github.com/redhat-ads-tech/parasol-insurance-secured-manifests.git
      users:
        - id: dev1
        - id: dev2
        - id: pe1
        - id: pe2
  templates:
    - group: parasol
      project: parasol-insurance
      branch: main
      templates:
        - devfile.yaml
    - group: rhdh
      project: rhdh-templates
      branch: main
      templates:
        - templates/parasol-insurance-secured/template.yaml
        - templates/request-kafka-topic/template.yaml
        - templates/request-kafka-user/template.yaml
        - templates/request-namespace/template.yaml
        - templates/quarkus-rest-api/template.yaml
