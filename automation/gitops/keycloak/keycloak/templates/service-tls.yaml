kind: Service
apiVersion: v1
metadata:
  name: {{ include "keycloak.name" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: keycloak-tls
    {{- include "keycloak.argocd-syncwave" . | nindent 4 }}
spec:
  ports:
    - name: https
      protocol: TCP
      port: 8443
      targetPort: 8443
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  selector:
    app: {{ include "keycloak.name" . }}
    app.kubernetes.io/instance: {{ include "keycloak.name" . }}
    app.kubernetes.io/managed-by: keycloak-operator
